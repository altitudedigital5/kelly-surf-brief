name: Deploy to CloudFront
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-1
  S3_BUCKET: kelly-surf-brief-891377350041
  CLOUDFRONT_ID: EPG55OY8P0OQS

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377350041:role/kelly-surf-brief-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync docs/ to S3
        run: |
          set -euo pipefail
          aws s3 cp docs/index.html "s3://${S3_BUCKET}/index.html" --content-type text/html --cache-control "max-age=60"
          if [ -f docs/latest.pdf ]; then
            aws s3 cp docs/latest.pdf "s3://${S3_BUCKET}/latest.pdf" --content-type application/pdf --cache-control "max-age=60"
          fi
          aws s3 sync docs/archive/ "s3://${S3_BUCKET}/archive/" \
            --exclude "*" --include "*.html" --include "*.pdf" \
            --cache-control "max-age=86400"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_ID}" \
            --paths "/" "/index.html" "/latest.pdf" "/archive/*"
